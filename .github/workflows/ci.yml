name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
jobs:
  linux-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/integration/run_linux.sh
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 redis-server
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m compileall -q src
      - run: python -m pytest tests -q
        env:
          PYTHONPATH: src
      - run: docker compose config --quiet
        env:
          REDIS_PASSWORD: ci-config-validation-only
          POSTGRES_PASSWORD: ci-config-validation-only
          GRAFANA_PASSWORD: ci-config-validation-only
      - run: docker compose -p mirage-staging -f compose.azure-staging.yml config --quiet
        env:
          REDIS_PASSWORD: ci-config-validation-only
          POSTGRES_PASSWORD: ci-config-validation-only
          MIRAGE_IMAGE: example.invalid/mirage@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MIRAGE_REDIS_IMAGE: example.invalid/redis@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MIRAGE_POSTGRES_IMAGE: example.invalid/postgres@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
