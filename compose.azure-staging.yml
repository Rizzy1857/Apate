# Standalone private Linux VM staging stack, not a base-compose override.
services:
  redis-store:
    image: ${MIRAGE_REDIS_IMAGE:?Set MIRAGE_REDIS_IMAGE to the scanned staging digest}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -ec, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 1gb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis-data:/data]
    networks: [research]
    mem_limit: 1536m
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'test "$$(redis-cli --raw ping)" = PONG']
      interval: 5s
      timeout: 3s
      retries: 12
  db-store:
    image: ${MIRAGE_POSTGRES_IMAGE:?Set MIRAGE_POSTGRES_IMAGE to the scanned staging digest}
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [research]
    mem_limit: 1g
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, pg_isready -U chronos -d chronos]
      interval: 5s
      timeout: 5s
      retries: 12
  core-engine:
    image: ${MIRAGE_IMAGE:?Set MIRAGE_IMAGE to a scanned registry image digest}
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYS_CHROOT, SETUID, SETGID, KILL]
    devices: [/dev/fuse]
    security_opt: [apparmor=unconfined, no-new-privileges:true]
    read_only: true
    pids_limit: 192
    mem_limit: 2g
    cpus: 2
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    environment:
      REDIS_HOST: redis-store
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      POSTGRES_HOST: db-store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CHRONOS_INFERENCE_MODE: deterministic
      CHRONOS_ARTIFACT_TREATMENT: deterministic
      CHRONOS_PERSISTENT_RUNS: "1"
      PYTHONPATH: /app/src
    ports: [127.0.0.1:2222:2222]
    volumes: [fuse-mount:/mnt/honeypot, audit-spool:/var/lib/chronos]
    depends_on:
      redis-store: {condition: service_healthy}
      db-store: {condition: service_healthy}
    networks: [research]
networks:
  research: {driver: bridge, internal: true}
volumes:
  redis-data:
  postgres-data:
  fuse-mount:
  audit-spool:
